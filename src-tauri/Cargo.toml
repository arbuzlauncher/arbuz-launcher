[package]
name = "arbuz-launcher"
version = "1.0.7"
edition = "2021"

[lib]
name = "arbuz_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2", "socks"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
fastnbt = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
walkdir = "2"
toml = "0.8"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
urlencoding = "2"
base64 = "0.22"
regex = "1"
sysinfo = "0.30"
tar = "0.4"
iroh = "1.3.0"
cafebabe = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
