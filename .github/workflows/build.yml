name: Build

# Собираем Windows, macOS и Linux. На push в main версия поднимается сама
# (1.0.0 → 1.0.1), ставится тег и публикуется релиз. Ручной запуск умеет
# поднять major/minor или собрать конкретную версию. В коммите можно написать
# [skip release], чтобы не выпускать релиз.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Версия релиза, например 1.0.1 (пусто — поднять автоматически)'
        required: false
        default: ''
      bump:
        description: 'Какую часть версии поднять'
        type: choice
        options: [none, patch, minor, major]
        default: patch
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: 'true'

jobs:
  # Версия, тег и решение, выпускать ли релиз.
  prepare:
    name: Версия и тег
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Определить версию
        id: ver
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
          BUMP: ${{ github.event.inputs.bump }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node scripts/ci-release.mjs

  # Типы и тесты Rust — на каждый PR и push.
  check:
    name: Проверка (tsc + cargo test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Системные библиотеки (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev \
            patchelf build-essential

      - name: Зависимости фронтенда
        run: pnpm install --frozen-lockfile

      - name: Типы TypeScript
        run: pnpm check

      # cargo test компилирует lib.rs с generate_context! — нужен собранный dist/.
      - name: Сборка фронтенда
        run: pnpm exec vite build

      - name: Тесты Rust
        run: pnpm test

  windows:
    name: Windows (exe + setup)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Зависимости фронтенда
        run: pnpm install --frozen-lockfile

      - name: Версия
        id: ver
        env:
          RELEASE_INPUT: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci-version.mjs

      - name: NSIS
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command makensis -ErrorAction SilentlyContinue) { exit 0 }
          choco install nsis --no-progress -y
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'makensis не найден'
          }

      - name: Сборка лаунчера
        run: pnpm tauri build --no-bundle

      - name: Установщик
        run: pnpm installer

      - name: Имена файлов релиза
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.prepare.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem 'src-tauri\target\release\bundle\arbuz\*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'установщик не собрался' }
          Copy-Item $setup.FullName "out/Arbuz-Launcher-$v-windows-x64-setup.exe"
          Copy-Item 'src-tauri\target\release\arbuz-launcher.exe' "out/Arbuz-Launcher-$v-windows-x64-portable.exe"
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Arbuz-Launcher-windows
          if-no-files-found: error
          retention-days: 14
          path: out/*

  macos:
    name: macOS (universal dmg)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Зависимости фронтенда
        run: pnpm install --frozen-lockfile

      - name: Версия
        id: ver
        env:
          RELEASE_INPUT: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci-version.mjs

      - name: Сборка (universal)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Имена файлов релиза
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p out
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          test -n "$dmg"
          cp "$dmg" "out/Arbuz-Launcher-$v-macos-universal.dmg"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Arbuz-Launcher-macos
          if-no-files-found: error
          retention-days: 14
          path: out/*

  linux:
    name: Linux (AppImage, deb, rpm, tar.xz)
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Системные библиотеки (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev \
            patchelf libfuse2 rpm file wget build-essential

      - name: Зависимости фронтенда
        run: pnpm install --frozen-lockfile

      - name: Версия
        id: ver
        env:
          RELEASE_INPUT: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci-version.mjs

      - name: Сборка пакетов
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Имена файлов релиза
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p out
          b=src-tauri/target/release/bundle
          cp "$(find $b/appimage -name '*.AppImage' | head -n1)" "out/Arbuz-Launcher-$v-linux-x86_64.AppImage"
          cp "$(find $b/deb -name '*.deb' | head -n1)"         "out/Arbuz-Launcher-$v-linux-amd64.deb"
          cp "$(find $b/rpm -name '*.rpm' | head -n1)"         "out/Arbuz-Launcher-$v-linux-x86_64.rpm"
          chmod +x out/*.AppImage

          # Портативный архив: сам бинарник, иконка и .desktop.
          mkdir -p pack/Arbuz-Launcher
          cp src-tauri/target/release/arbuz-launcher pack/Arbuz-Launcher/
          cp src-tauri/icons/icon.png pack/Arbuz-Launcher/arbuz-launcher.png
          cat > pack/Arbuz-Launcher/arbuz-launcher.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Arbuz Launcher
          Comment=Minecraft launcher
          Exec=arbuz-launcher
          Icon=arbuz-launcher
          Terminal=false
          Categories=Game;
          DESKTOP
          tar -cJf "out/Arbuz-Launcher-$v-linux-x86_64.tar.xz" -C pack Arbuz-Launcher
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Arbuz-Launcher-linux
          if-no-files-found: error
          retention-days: 14
          path: out/*

  release:
    name: Публикация релиза
    needs: [prepare, windows, macos, linux]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Список файлов
        run: find dist -type f | sort

      - name: Контрольные суммы
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Arbuz Launcher ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*
